services:
  - type: web
    name: sombrinha-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/summary
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sombrinha-db
          property: connectionString

databases:
  - name: sombrinha-db
    databaseName: sombrinha
    user: sombrinha
    plan: free
