services:
  - type: web
    name: sombrinha-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/summary
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sombrinha-db
          property: connectionString
      - key: GOOGLE_WEATHER_API_KEY
        sync: false

databases:
  - name: sombrinha-db
    databaseName: sombrinha
    user: sombrinha
    plan: free
