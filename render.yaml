services:
  - type: web
    name: sombrinha-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /api/summary
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sombrinha-db
          property: connectionString

databases:
  - name: sombrinha-db
    databaseName: sombrinha
    user: sombrinha
    plan: free
